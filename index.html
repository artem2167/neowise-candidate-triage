<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    button:disabled { cursor: wait; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <p>Получите тему и черновик ответа. Перед отправкой клиенту проверьте текст.</p>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <pre id="result" role="status" aria-live="polite" aria-atomic="true"></pre>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = document.querySelector("button");
    const result = document.querySelector("#result");
    const topics = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };
    let busy = false;

    function showManualReview() {
      result.textContent = "Не удалось подготовить надёжный черновик. Разберите заявку вручную и подготовьте ответ клиенту.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;

      const text = message.value.trim();
      result.textContent = "";
      if (!text) {
        result.textContent = "Введите текст заявки: поле не должно быть пустым.";
        message.focus();
        return;
      }

      busy = true;
      button.disabled = true;
      message.disabled = true;
      form.setAttribute("aria-busy", "true");
      result.textContent = "Разбираем заявку…";
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 3_000);
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: controller.signal,
        });
        const data = await reply.json();
        if (reply.status === 400 && data?.status === "invalid_input") {
          result.textContent = "Введите непустой текст заявки и попробуйте ещё раз.";
        } else if (
          reply.ok && data && typeof data === "object" && !Array.isArray(data) &&
          data.status === "ready" && typeof data.topic === "string" &&
          Object.hasOwn(topics, data.topic) &&
          typeof data.draft === "string" && data.draft.trim()
        ) {
          result.textContent = `Тема: ${topics[data.topic]}\n\nЧерновик ответа:\n${data.draft.trim()}\n\nПроверьте черновик перед отправкой клиенту.`;
        } else {
          showManualReview();
        }
      } catch {
        showManualReview();
      } finally {
        clearTimeout(timer);
        busy = false;
        button.disabled = false;
        message.disabled = false;
        form.setAttribute("aria-busy", "false");
      }
    });
  </script>
</body>
</html>
